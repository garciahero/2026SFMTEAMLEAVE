name: Sync HTML from Google Drive

on:
  schedule:
    # 這裡代表每小時的第 0 分鐘，GitHub 會自動在雲端執行一次更新
    - cron: '0 * * * *'
  workflow_dispatch: # 允許你隨時手動點擊按鈕「立刻更新」

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 解鎖寫入權限，防止噴出 Exit Code 128
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download HTML from Google Docs
        run: |
          # 使用 Google Docs 官方匯出純文字管道，100% 避開安全攔截，直接抓取網頁原始碼
          curl -L "https://google.com" -o index.html

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 從雲端拉取最新進度，防止版本衝突
          git fetch origin
          
          # 自動獲取目前正確的主分支名稱 (main)
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "目前正在處理的分支是: $CURRENT_BRANCH"
          
          # 檢查下載的網頁內容是否有效，若空檔則報錯
          if [ ! -s index.html ]; then
            echo "錯誤：下載的網頁檔案為空，請檢查 Google 文件分享權限！"
            exit 1
          fi
          
          git add index.html
          if git diff --staged --quiet; then
            echo "Google Docs 沒有任何更改，跳過本次更新。"
          else
            git commit -m "Auto-update website from Google Docs"
            git push origin $CURRENT_BRANCH
          fi
