name: Sync HTML from Google Drive

on:
  schedule:
    # 這裡代表每小時的第 0 分鐘，GitHub 會自動在雲端執行一次更新
    - cron: '0 * * * *'
  workflow_dispatch: # 允許你隨時手動點擊按鈕「立刻更新」

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download HTML from Google Drive
        run: |
          # 請把下方的【你的GoogleDrive檔案ID】換成你在第一步複製的那串 ID
          curl -L -o index.html "https://drive.google.com/file/d/13pC-QFKdJSxiwfTH61kd1PF5LMP0-L8b/view?usp=sharing"

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # 1. 強制從雲端拉取最新進度，防止衝突
          git fetch origin
          
          # 2. 自動獲取目前正確的分支名稱 (可能是 main 或 master)
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "目前正在處理的分支是: $CURRENT_BRANCH"
          
          # 3. 檢查檔案是否有變動
          if [ ! -s index.html ]; then
            echo "錯誤：下載的檔案為空，請檢查 Google Drive 權限！"
            exit 1
          fi
          
          git add index.html
          if git diff --staged --quiet; then
            echo "檔案沒有任何更改，跳過本次更新。"
          else
            git commit -m "Auto-update website from Google Drive"
            # 4. 動態推送到正確的分支
            git push origin $CURRENT_BRANCH
          fi
